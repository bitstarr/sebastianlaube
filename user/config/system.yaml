home:
  alias: '/home'

pages:
  theme: laube
  markdown:
    extra: true
  process:
    markdown: true
    twig: true
  frontmatter:
    process_twig: true
  redirect_default_route: true

session:
  initialize: false
  name: grav-site

default_locale: 'de'
languages:
  supported: [ de, en ]
  default_lang: de
  include_default_lang: false
  include_default_lang_file_extension: false

images:
  default_image_quality: 70
  defaults:
    loading: lazy

strict_mode:
  twig2_compat: false
  twig3_compat: true

pwd_regex: '^[ -~]{8,}$'