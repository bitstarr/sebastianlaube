description: 'Für die beste Craft-Beer-Kneipe der Stadt bestand der Wunsch nach etwas bewusst Reduziertem. Im Kontrast zur Einrichtung der Bar ist die Website sehr minimalistisch und fokussiert sich auf die Inhalte, wie z. B. die anstehenden Termine. Dabei wird die Seite in drei Sprachen angeboten, denn es gibt nicht nur Bier aus Tschechien, auch der Wirt stammt von dort.'
