description: 'Das Gästehaus liegt wunderbar im Grünen und ist trotzdem gut zu erreichen. Der ideale Ort für Tagungen, Klausuren, Vereinsausflüge oder einfach eine Reise in die Region um den Sachsenring. Nun zeigen sich Räume und Leistungsumfang in einem stilvollen Gewand, das sich an den Farben der Diakonie orientiert, zu der das Gästehaus gehört.'
