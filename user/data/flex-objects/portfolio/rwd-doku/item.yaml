title: 'Responsive Webdesign Doku'
description: 'Ich habe relativ schnell viel Wissen zum Thema Responsive Web Design und Websites für mobile Endgeräte ansammeln und praktisch anwenden können. Vor allem den Kolleg:innen, die im Tagesgeschäft feststeckten, wollte ich dieses Wissen weitergeben. Während des Einsatzes in verschiedenen Projektteams wurde mir klar, dass es dazu auch einen Schnappschuss dieses Wissens brauchte, und so schrieb ich über ein paar Wochen so viel wie möglich zusammen.'
