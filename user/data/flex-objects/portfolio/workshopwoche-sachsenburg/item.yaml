title: 'Workshopwoche Sachsenburg'
description: 'Den dunkelsten Teil der deutschen Geschichte kennt man aus Büchern und den Medien. Oft etwas distanziert. Die Jugendinitiative Klick wollte zusammen mit jungen Leuten aus Mittelsachsen diese Geschichte in der eigenen Region selbst erforschen. Interessenten konnten sich direkt dort anmelden. Außerdem reagiert die Seite mittels Media Queries auf die Bildschirmauflösung des Nutzers und ist somit auch auf Tablets und Smartphones gut zu benutzen.'
